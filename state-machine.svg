<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
<title>Firmware state machine</title>
<desc>Cold boot commissions Zigbee then sleeps. Deep sleep is exited either by the INT1 GPIO wake into a wind event loop, or by the heartbeat timer. Both paths report and return to deep sleep.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.s{font-size:12px;font-weight:400;fill:#5F5E5A}
.w{stroke:#73726C;stroke-width:1.5;fill:none;stroke-linecap:round}
.lbl{font-size:12px;fill:#5F5E5A}
</style>
<rect width="680" height="430" fill="#FDFDFC"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="250" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="t" x="340" y="64" text-anchor="middle">Cold boot</text>
<text class="s" x="340" y="82" text-anchor="middle">verify 0xE5, join Zigbee</text>

<line class="w" x1="340" y1="96" x2="340" y2="140" marker-end="url(#a)"/>

<rect x="250" y="140" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="t" x="340" y="164" text-anchor="middle" fill="#3C3489">Deep sleep</text>
<text class="s" x="340" y="182" text-anchor="middle" fill="#534AB7">~58&#8211;85 &#181;A</text>

<path class="w" d="M250 168 L160 168 L160 260" marker-end="url(#a)"/>
<text class="lbl" x="152" y="216" text-anchor="end">IO13 wake</text>
<path class="w" d="M430 168 L520 168 L520 260" marker-end="url(#a)"/>
<text class="lbl" x="528" y="216">timer</text>

<rect x="60" y="260" width="200" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="t" x="160" y="284" text-anchor="middle" fill="#085041">Wind event</text>
<text class="s" x="160" y="302" text-anchor="middle" fill="#0F6E56">stay awake, report 30 s</text>
<text class="s" x="160" y="320" text-anchor="middle" fill="#0F6E56">until 3 quiet windows</text>

<rect x="420" y="260" width="200" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="t" x="520" y="284" text-anchor="middle" fill="#085041">Heartbeat</text>
<text class="s" x="520" y="302" text-anchor="middle" fill="#0F6E56">one window + battery</text>
<text class="s" x="520" y="320" text-anchor="middle" fill="#0F6E56">every 30 min</text>

<path class="w" d="M160 332 L160 376 L340 376 L340 200" marker-end="url(#a)"/>
<path class="w" d="M520 332 L520 376 L342 376" />
<text class="lbl" x="340" y="398" text-anchor="middle">clear INT_SOURCE, re-arm activity, sleep</text>
</svg>
