# Managed components. Downloaded on the first `idf.py build` into managed_components/.
# esp-zigbee-lib >= 2.0.0 is the 2.x ezb_* / esp_zigbee_* "ezbee" API (ESP-IDF 6.x). This is
# DIFFERENT from the older esp_zb_* 1.x API; the app code uses the 2.x names.
dependencies:
  idf:
    version: ">=5.2"
  espressif/esp-zigbee-lib:
    version: ">=2.0.0"
  # SK6812 status LED on IO22 (RMT backend).
  espressif/led_strip:
    version: "^3.0.0"
