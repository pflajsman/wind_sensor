# Home Assistant REST integration for the Awning Wind Sensor — via the deCONZ REST API.
#
# WHY REST instead of the deCONZ HA integration: the four movement values come through as
# deCONZ CLIPConsumption (`$TYPE_CONSUMPTION_SENSOR`) sensors, which the official deCONZ HA
# integration does not reliably import as usable entities. Polling the deCONZ REST API
# directly always works. This file creates the same entity IDs the automations in
# home_assistant.yaml expect, so you can use both files together.
#
# ────────────────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP
# ────────────────────────────────────────────────────────────────────────────────────────
# 1. Get a deCONZ API key (token):
#    a. Phoscon → ☰ menu → Settings → Gateway → Advanced → click "Authenticate app"
#       (this unlocks the gateway for ~60 s).
#    b. Within that minute, from a terminal on your HA box (or any machine that can reach
#       deCONZ), POST to the API to mint a key:
#         curl -sX POST http://core-deconz:40850/api -d '{"devicetype":"ha-rest"}'
#       The reply looks like: [{"success":{"username":"A1B2C3D4E5"}}]
#       That "username" value IS your API key.
#    c. Paste it below as DECONZ_API_KEY (see the `secrets.yaml` note).
#
# 2. Host/port: the deCONZ add-on is reachable from HA at http://core-deconz:40850
#    (add-on internal hostname). If that fails, use your HA host IP + the add-on's mapped
#    port, e.g. http://192.168.1.10:40850. Adjust DECONZ_HOST below.
#
# 3. Put secrets in config/secrets.yaml instead of hardcoding:
#      deconz_api_key: "A1B2C3D4E5..."
#    and this file references it as !secret deconz_api_key.
#
# 4. Add this file to configuration.yaml, e.g.:
#      rest: !include integration/home_assistant_rest.yaml     # (if you split it out)
#    OR paste the `rest:` block below directly into configuration.yaml.
#
# 5. Restart HA (or reload REST entities). Values appear as:
#      sensor.awning_wind_sensor_movement_rms
#      sensor.awning_wind_sensor_movement_peak
#      sensor.awning_wind_sensor_tilt_pitch
#      sensor.awning_wind_sensor_tilt_roll
#      sensor.awning_wind_sensor_battery
#      sensor.awning_wind_sensor_motion        (occupancy boolean; = Phoscon Motion card)
#    plus a live-tunable close threshold + example automation (see bottom of file):
#      input_number.awning_close_threshold
#      automation "Awning: close on strong movement"
# ────────────────────────────────────────────────────────────────────────────────────────
#
# HOW IT WORKS: one REST resource polls the whole /sensors list every 60 s, then five
# template sensors pick out each value by matching the deCONZ sensor's `uniqueid`. Matching
# by uniqueid (the device IEEE + endpoint) is robust — it survives deCONZ renumbering the
# sensor IDs. The IEEE below is a placeholder; set DEVICE_IEEE to your device's address
# (deCONZ GUI → node, or Phoscon → the sensor → its uniqueid, first 8 byte-pairs).

# ==========================================================================================
# ►►► THE ONLY TWO EDITS YOU NEED ◄◄◄  — then find/replace them throughout this file.
# ------------------------------------------------------------------------------------------
#   DECONZ_API_KEY  →  the token you minted (Phoscon → Settings → Gateway → Advanced →
#                      "Authenticate app", then within 60 s:
#                        curl -sX POST http://core-deconz:40850/api -d '{"devicetype":"ha-rest"}'
#                      the reply's "username" IS the key).
#   DEVICE_IEEE     →  your device IEEE, lowercase colon-separated, e.g.
#                      "00:11:22:33:44:55:66:77"  (deCONZ node → "MAC address", or Phoscon →
#                      the sensor → uniqueid, first 8 byte-pairs).
#   DECONZ host/port→  default http://core-deconz:40850 is the HA deCONZ add-on's internal
#                      name. If HA can't reach it, use your deCONZ host IP + mapped port.
#
# QUICK SANITY CHECK before pasting into HA — confirm REST can see the device at all.
# No Python needed. Pick whichever shell you have:
#   bash:        curl -s http://core-deconz:40850/api/DECONZ_API_KEY/sensors | grep -io 'uniqueid":"[^"]*'
#   PowerShell:  (Invoke-RestMethod "http://core-deconz:40850/api/DECONZ_API_KEY/sensors").PSObject.Properties.Value |
#                  Select-Object name, type, uniqueid
# You should see lines with your DEVICE_IEEE and endpoints -0a-/-0b-/-0c-/-0d-/-0e-.
# If that returns nothing, HA integration won't help either — fix deCONZ visibility first.
# ==========================================================================================

# ==========================================================================================
# RELIABLE FORM — five REST sensors, each filters the /sensors list by uniqueid + item.
# The uniqueid deCONZ assigns looks like "<ieee>-<endpoint>-0500" per subdevice; we match
# on the ieee + endpoint. Endpoints: 0x0a=rms, 0x0b=peak, 0x0c=pitch, 0x0d=roll(+battery).
# ==========================================================================================
sensor:
  - platform: rest
    name: "Awning wind sensor movement rms"
    unique_id: awning_wind_sensor_movement_rms
    resource: "http://core-deconz:40850/api/DECONZ_API_KEY/sensors"
    scan_interval: 60
    unit_of_measurement: "mg"
    value_template: >
      {% set ns = namespace(v=none) %}
      {% for k, s in value_json.items() %}
        {% if s.uniqueid is defined and s.uniqueid.startswith('DEVICE_IEEE')
              and '-0a-' in s.uniqueid %}
          {% set ns.v = s.state.movement_rms | default(s.state.consumption) %}
        {% endif %}
      {% endfor %}
      {{ ns.v }}

  - platform: rest
    name: "Awning wind sensor movement peak"
    unique_id: awning_wind_sensor_movement_peak
    resource: "http://core-deconz:40850/api/DECONZ_API_KEY/sensors"
    scan_interval: 60
    unit_of_measurement: "mg"
    value_template: >
      {% set ns = namespace(v=none) %}
      {% for k, s in value_json.items() %}
        {% if s.uniqueid is defined and s.uniqueid.startswith('DEVICE_IEEE')
              and '-0b-' in s.uniqueid %}
          {% set ns.v = s.state.movement_peak | default(s.state.consumption) %}
        {% endif %}
      {% endfor %}
      {{ ns.v }}

  - platform: rest
    name: "Awning wind sensor tilt pitch"
    unique_id: awning_wind_sensor_tilt_pitch
    resource: "http://core-deconz:40850/api/DECONZ_API_KEY/sensors"
    scan_interval: 60
    unit_of_measurement: "°"
    value_template: >
      {% set ns = namespace(v=none) %}
      {% for k, s in value_json.items() %}
        {% if s.uniqueid is defined and s.uniqueid.startswith('DEVICE_IEEE')
              and '-0c-' in s.uniqueid %}
          {% set ns.v = s.state.tilt_pitch | default(s.state.consumption) %}
        {% endif %}
      {% endfor %}
      {{ ns.v }}

  - platform: rest
    name: "Awning wind sensor tilt roll"
    unique_id: awning_wind_sensor_tilt_roll
    resource: "http://core-deconz:40850/api/DECONZ_API_KEY/sensors"
    scan_interval: 60
    unit_of_measurement: "°"
    value_template: >
      {% set ns = namespace(v=none) %}
      {% for k, s in value_json.items() %}
        {% if s.uniqueid is defined and s.uniqueid.startswith('DEVICE_IEEE')
              and '-0d-' in s.uniqueid %}
          {% set ns.v = s.state.tilt_roll | default(s.state.consumption) %}
        {% endif %}
      {% endfor %}
      {{ ns.v }}

  - platform: rest
    name: "Awning wind sensor battery"
    unique_id: awning_wind_sensor_battery
    resource: "http://core-deconz:40850/api/DECONZ_API_KEY/sensors"
    scan_interval: 300
    unit_of_measurement: "%"
    device_class: battery
    value_template: >
      {% set ns = namespace(v=none) %}
      {% for k, s in value_json.items() %}
        {% if s.uniqueid is defined and s.uniqueid.startswith('DEVICE_IEEE')
              and '-0d-' in s.uniqueid and s.config is defined %}
          {% set ns.v = s.config.battery %}
        {% endif %}
      {% endfor %}
      {{ ns.v }}

  # Occupancy / "motion" boolean from the new Occupancy Sensing endpoint (0x0e). This is the
  # SAME thing Phoscon shows as a Motion card. It flips true when movement_rms exceeds the
  # firmware's on-device threshold (NVS key motion_mg). Handy in HA as a quick "is it windy"
  # binary, but the PRECISE close-logic below uses movement_rms + the slider, not this.
  - platform: rest
    name: "Awning wind sensor motion"
    unique_id: awning_wind_sensor_motion
    resource: "http://core-deconz:40850/api/DECONZ_API_KEY/sensors"
    scan_interval: 60
    value_template: >
      {% set ns = namespace(v=none) %}
      {% for k, s in value_json.items() %}
        {% if s.uniqueid is defined and s.uniqueid.startswith('DEVICE_IEEE')
              and '-0e-' in s.uniqueid %}
          {% set ns.v = s.state.presence %}
        {% endif %}
      {% endfor %}
      {{ 'on' if ns.v else 'off' }}

# ==========================================================================================
# LIVE-TUNABLE CLOSE THRESHOLD (this is where you calibrate "close the awning").
# ------------------------------------------------------------------------------------------
# The device sends the raw movement intensity as `sensor.awning_wind_sensor_movement_rms`
# (in mg). You do NOT reflash the firmware to tune the close point — you slide this
# input_number in the HA UI. Method: watch real wind; if the awning fails to close in a gust
# you consider dangerous, LOWER this number; if it closes too eagerly in a light breeze,
# RAISE it. Repeat until it matches your expectation. (There is no true "cm" here — an
# accelerometer gives movement intensity, not displacement. Calibrating by trial against
# this single monotonic number is the honest, reliable approach.)
#
# Put this under `input_number:` in configuration.yaml (or an !include).
# ==========================================================================================
input_number:
  awning_close_threshold:
    name: Awning close threshold (movement mg)
    min: 20
    max: 2000
    step: 10
    initial: 300          # starting guess — TUNE THIS against real wind
    unit_of_measurement: "mg"
    mode: slider

# ==========================================================================================
# EXAMPLE AUTOMATION — close the awning when movement exceeds the tunable threshold.
# Put this under `automation:` in configuration.yaml (or an !include). Replace
# `cover.awning` with your actual awning cover entity. The `for:` debounce avoids closing on
# a single brief spike; tune it too.
# ==========================================================================================
automation:
  - alias: "Awning: close on strong movement"
    trigger:
      - platform: numeric_state
        entity_id: sensor.awning_wind_sensor_movement_rms
        above: input_number.awning_close_threshold   # compares against the live slider
        for:
          seconds: 10                                 # sustained, not a one-off jolt
    condition:
      - condition: template
        value_template: "{{ states('cover.awning') != 'closed' }}"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.awning
