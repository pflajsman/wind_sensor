# Home Assistant configuration for the Awning Wind Protection Sensor (spec §11).
#
# The firmware only reports numbers. ALL retract/extend decisions live here.
#
# HOST PATH: deCONZ / Phoscon (ConBee II running deCONZ 2.33.2), via HA's official
# deCONZ integration. See integration/deconz/ for the DDF that surfaces the values.
#
# Replace the entity IDs below to match your setup. With the deCONZ integration,
# HA derives entity IDs from the Phoscon *device name* you assign on join, e.g. if
# you name the device "Awning wind sensor":
#   sensor.awning_wind_sensor_movement_rms   (mg, DDF state/movement_rms, EP 10)
#   sensor.awning_wind_sensor_battery        (%, DDF config/battery)
#   cover.awning                             (your awning cover entity)
#   notify.mobile_app_phone                  (your phone notify service)
#
# Confirm the exact IDs in Developer Tools -> States after the device joins; deCONZ
# custom sensors can land with a numeric suffix (e.g. _movement_rms_2). Adjust to match.

# ---------------------------------------------------------------------------
# Helpers (§11). The user-facing sensitivity controls.
# ---------------------------------------------------------------------------
input_number:
  awning_wind_threshold:
    name: Awning wind threshold
    min: 20
    max: 1000
    step: 5
    unit_of_measurement: mg
    initial: 250          # tune this AFTER acceptance test 7 (measure your awning)
  awning_wind_clear_threshold:
    name: Awning wind clear threshold
    min: 20
    max: 1000
    step: 5
    unit_of_measurement: mg
    initial: 100          # hysteresis floor for re-extend

automation:
  # 1. Retract on sustained movement (§11.1). Sustained, not instantaneous —
  #    birds, rain bursts and a bumped bar all make single spikes.
  - alias: Awning - retract on movement
    trigger:
      - platform: numeric_state
        entity_id: sensor.awning_wind_sensor_movement_rms
        above: input_number.awning_wind_threshold
        for: "00:00:07"        # 5-10 s sustained
    condition:
      - condition: state
        entity_id: cover.awning
        state: open
      # Motor movement looks exactly like wind (§8.6): require the cover to have
      # been idle for >= 90 s so we don't react to our own extend/retract.
      - condition: template
        value_template: >
          {{ (now() - states.cover.awning.last_changed).total_seconds() > 90 }}
    action:
      - service: cover.close_cover
        target: {entity_id: cover.awning}

  # 2. Hysteresis on re-extend (§11.2). Do not auto-re-extend until movement has
  #    stayed low for 15-20 min, or the tube motor cycles all afternoon and dies.
  - alias: Awning - allow re-extend after calm
    trigger:
      - platform: numeric_state
        entity_id: sensor.awning_wind_sensor_movement_rms
        below: input_number.awning_wind_clear_threshold
        for: "00:18:00"
    condition:
      - condition: state
        entity_id: input_boolean.awning_auto_extend_enabled
        state: "off"
    action:
      - service: input_boolean.turn_on
        target: {entity_id: input_boolean.awning_auto_extend_enabled}

  # 3. Watchdog — NOT optional (§11.3). A sleeping/flat/off-mesh sensor is
  #    indistinguishable from calm. Heartbeat is 30 min; 45 min allows one miss.
  - alias: Awning - watchdog retract on stale sensor
    trigger:
      - platform: state
        entity_id: sensor.awning_wind_sensor_movement_rms
        to: "unavailable"
      - platform: template
        value_template: >
          {{ (now() - states.sensor.awning_wind_sensor_movement_rms.last_updated).total_seconds() > 2700 }}
    action:
      - service: cover.close_cover
        target: {entity_id: cover.awning}
      - service: input_boolean.turn_off
        target: {entity_id: input_boolean.awning_auto_extend_enabled}
      - service: notify.mobile_app_phone
        data:
          title: Awning sensor offline
          message: Sensor stale/unavailable — awning retracted and locked closed.

  # 4. Battery alert at 20% (§11.4).
  - alias: Awning - battery low
    trigger:
      - platform: numeric_state
        entity_id: sensor.awning_wind_sensor_battery
        below: 20
    action:
      - service: notify.mobile_app_phone
        data:
          title: Awning sensor battery low
          message: Bring the sensor in and charge it over USB-C.

  # 5. Forecast guard on extend (§11.5). The sensor cannot detect wind while the
  #    awning is rolled up — block extension when forecast wind is high.
  #    Wire this into whatever extend automation you use; example condition:
  #      condition: numeric_state
  #      entity_id: sensor.home_forecast_wind_speed
  #      below: 25   # km/h, your choice

# Gate used by automations 2 & 3 to hold auto-extend off until proven calm.
input_boolean:
  awning_auto_extend_enabled:
    name: Awning auto-extend enabled
    initial: true
