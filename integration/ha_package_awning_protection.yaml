# Home Assistant PACKAGE for awning-protection — via the deCONZ REST API.
#
# Uses the MODERN `rest:` integration (one resource, multiple sensors) instead of the legacy
# `sensor: - platform: rest`. Easier to debug and the current HA-recommended form.
#
# ────────────────────────────────────────────────────────────────────────────────────────
# INSTALL — ALL THREE are required or HA silently ignores the file (no error, no entities):
# ────────────────────────────────────────────────────────────────────────────────────────
# 1. configuration.yaml MUST contain (mind the indentation — packages under homeassistant):
#
#        homeassistant:
#          packages: !include_dir_named packages
#
#    You previously had NO `homeassistant:` block — if it's still missing, THIS is why no
#    entities appear. Add it (e.g. right under `default_config:`).
#
# 2. A folder literally named `packages` next to configuration.yaml (e.g. /config/packages/).
#
# 3. THIS FILE saved inside it, e.g. /config/packages/awning_protection.yaml
#
# Then: Developer Tools -> YAML -> "Check Configuration" -> Restart.
#
# Entities created:
#     binary_sensor.awning_protected            <- use this in automations (occupancy)
#     sensor.awning_protection_battery          (%)
#     sensor.awning_protection_presence_raw     (on/off text, debug)
#
# ────────────────────────────────────────────────────────────────────────────────────────
# BAKED-IN VALUES
#     deCONZ API key : 7538CF4326
#     Device IEEE    : 74:4d:bd:ff:fe:6d:58:e1
#     deCONZ host    : http://core-deconz:40850
# If HA reaches deCONZ at another address, find/replace http://core-deconz:40850 below.
#
# SANITY (run on the HA box): curl -s http://core-deconz:40850/api/7538CF4326/sensors | head
# ==========================================================================================

rest:
  - resource: "http://core-deconz:40850/api/7538CF4326/sensors"
    scan_interval: 60
    sensor:
      # Presence "awning protected" boolean as on/off text (matched by IEEE only).
      - name: "Awning protection presence raw"
        unique_id: awning_protection_presence_raw
        value_template: >
          {% set ns = namespace(v=none) %}
          {% for k, s in value_json.items() %}
            {% if s.uniqueid is defined and s.uniqueid.startswith('74:4d:bd:ff:fe:6d:58:e1')
                  and s.state is defined and s.state.presence is defined %}
              {% set ns.v = s.state.presence %}
            {% endif %}
          {% endfor %}
          {{ 'on' if ns.v else 'off' }}

      # Battery percentage (config.battery, with state.battery fallback). Emits an EMPTY
      # string when no value is found -> HA treats it as 'unknown' (a battery device_class
      # sensor rejects the literal text 'None', which is what caused the ValueError).
      - name: "Awning protection battery"
        unique_id: awning_protection_battery
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        value_template: >
          {% set ns = namespace(v=none) %}
          {% for k, s in value_json.items() %}
            {% if s.uniqueid is defined and s.uniqueid.startswith('74:4d:bd:ff:fe:6d:58:e1') %}
              {% if s.config is defined and s.config.battery is defined and s.config.battery != none %}
                {% set ns.v = s.config.battery %}
              {% elif s.state is defined and s.state.battery is defined and s.state.battery != none %}
                {% set ns.v = s.state.battery %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.v is not none %}{{ ns.v }}{% endif %}

# Real occupancy binary_sensor built from the presence text sensor above.
template:
  - binary_sensor:
      - name: "Awning protected"
        unique_id: awning_protected
        device_class: occupancy
        state: "{{ is_state('sensor.awning_protection_presence_raw', 'on') }}"
        availability: >
          {{ states('sensor.awning_protection_presence_raw') not in
             ['unknown', 'unavailable'] }}

